name: insurance_app
description: "Dilnia Insuranse application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 4.4.4+4

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_image_compress: ^2.4.0
  get: 4.6.6
  path: ^1.9.0
  connectivity_plus: ^6.1.1
  shared_preferences: ^2.2.1
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  pin_code_fields: ^8.0.1
  sms_autofill: ^2.3.0
  pin_input_text_field: ^4.5.1
  flutter_svg_provider: ^1.0.6
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  pinput: ^5.0.0
  calendar_date_picker2: ^1.1.8
  colorful_safe_area: ^1.0.0
  bottom_picker: ^2.1.1
  easy_stepper: ^0.8.5+1
  file_picker: ^8.1.7
  get_storage: ^2.1.1
  flutter_widget_from_html_core: ^0.15.2
  image_picker: ^1.1.2
  date_picker_plus: ^4.1.0
  country_picker: ^2.0.27

  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  currency_text_input_formatter: ^2.2.9
  pdf: ^3.11.3
  path_provider: ^2.1.5
  open_file: ^3.5.10
  dropdown_button2: ^2.3.9
  flutter_inappwebview: ^6.1.5

  rename_app: ^1.6.5

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplayBold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplayRegular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplaySemibold.ttf
          weight: 600
    - family: SF UI Text
      fonts:
        - asset: assets/fonts/SFUITextRegular.ttf
          weight: 400
    - family: KurdishFont
      fonts:
      - asset: assets/fonts/UniMahanSaria.ttf
        weight: 400
      - asset: assets/fonts/K24KurdishBold-Bold.ttf
        weight: 700
      - asset: assets/fonts/K24KurdishLight-Light.ttf
        weight: 300
      
      
     
        
